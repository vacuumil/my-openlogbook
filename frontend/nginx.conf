server {
    listen 80;
    server_name localhost;

    # Hardening & Information Disclosure Prevention
    server_tokens off;
    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /usr/share/nginx/html;
    index index.html;

    # add_header is not inherited by locations that set their own, so every
    # location below includes the snippet explicitly.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these files, so they can be cached forever
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # nginx's default types lack .mjs, and with nosniff the browser refuses to run the
        # PDF worker served as octet-stream. A types block replaces the map, so list them all.
        types {
            application/javascript js mjs;
            text/css css;
            application/json json;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            image/webp webp;
            font/woff2 woff2;
            font/ttf ttf;
        }
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://openlogbook-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
